<body>
	<div id=intro>
		<h1>TileMan.io</h1>
		<p><a href="/">Back to game</a></p>
		<h2>Settings</h2>
		<h3>Privacy</h3>
		<script>
		var aiptag = aiptag || {};
		aiptag.cmd = aiptag.cmd || [];
		aiptag.cmd.display = aiptag.cmd.display || [];	aiptag.cmd.player = aiptag.cmd.player || [];
		</script>
		<script async src="https://api.adinplay.com/libs/aiptag/pub/TMN/tileman.io/tag.min.js"></script>
		<input type=button value="Change your consent" onclick="aipAPItag.showConsentToolSettings();">
		<hr>
		<h3>Colors and graphics</h3>
		<p>Favorite colors for your player</p>
		<div id=favcol>
		<label>Select all <input type=checkbox id=colsel></label><br>
		<div id=colors>
		</div>
		<div id=nosha><div><a id=sha1 href="https://www.facebook.com//sharer/sharer.php?u=tileman.io" target="_blank" onauxclick="localStorage.sha=true;">Share</a> or <a id=sha2 href="https://twitter.com//intent/tweet?hashtags=tilemanio&text=Play%20this%20game&url=http%3A%2F%2Ftileman.io" target="_blank" onauxclick="localStorage.sha=true;">Tweet</a> to unlock selecting of favorite colors for your player.</div></div>
		</div>
		<br>
		<br>
		<label>Colors lightness <input type=range id=clg2 value=0 min=-0.75 max=0.75 step=0.25></label><br>
		<br>
		<label>Grid color <input type=color id=bg></label> <input type=button value=Default onclick=rem("bg")><br>
		<br>
		<label>Wall color <input type=color id=bgwa></label> <input type=button value=Default onclick=rem("bgwa")><br>
		<br>
		<label>Color of unoccupied tiles <input type=color id=bgem></label> <input type=button value=Default onclick=rem("bgem")><br>
		<br>
		<label>Animation of tiles <input type=checkbox id=an></label><br>
		<br>
		<label>Enabled skins <input type=checkbox id=ski></label><br>
		<br>
		<label>Grid width <input type=range id=spa value=1 min=0 max=2 step=0.5></label><br>
		<br>
		<label>Graphics quality (resolution) <select id=ql><option value="1">High (default)</option><option value="0.75">Medium</option><option value="0.5">Low</option></select></label><br>
		<br>
		<hr>
		<h3>Advanced</h3>
		<label>Show player names <input type=checkbox id=pna></label><br>
		<br>
		<label>Censor words/strings in player names (one per line) <textarea id=cs2 maxlength=5000 rows=3 style="vertical-align: top;"></textarea></label><br>
		<br>
		<label>Old touch screen buttons <input type=checkbox id=tb></label><br>
		<br>
		<div hidden><label>Client-side movement <input type=checkbox id=cm></label><br>
		<small>This is very usefull if you or server lag. Don't disable it!</small>
		<br></div>
		<label>Show your real (server) position as semi-transparent dot <input type=checkbox id=rp></label><br>
		<small>Useful for testing.</small>
		<br><br>
		<button id=reset_set>Reset SETTINGS</button> 
		<button id=reset_score>Reset HIGH SCORE</button>
		
		<br><br>
	</div>
	<script src="/hra.min.js"></script>
